<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Hero: Any FEN / PGN → Living Color Flow Visualization -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.55" stop-color="#12151D"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F2B01E"/>
      <stop offset="0.5" stop-color="#F7C558"/>
      <stop offset="1" stop-color="#D99A12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient gold aura behind board -->
  <circle cx="1130" cy="450" r="360" fill="#F2B01E" opacity="0.05"/>
  <circle cx="1130" cy="450" r="250" fill="#F2B01E" opacity="0.04"/>

  <!-- ===== LEFT: the input ===== -->
  <g font-family="Menlo, 'SF Mono', monospace">
    <rect x="90" y="330" width="560" height="170" rx="14" fill="#12151D" stroke="#2A2F3C" stroke-width="1.5"/>
    <circle cx="122" cy="362" r="6" fill="#DC2626"/>
    <circle cx="144" cy="362" r="6" fill="#F59E0B"/>
    <circle cx="166" cy="362" r="6" fill="#10B981"/>
    <text x="118" y="412" font-size="21" fill="#8B93A7">r1bqkbnr/pppp1ppp/2n5/</text>
    <text x="118" y="444" font-size="21" fill="#8B93A7">4p3/2B1P3/5N2/PPPP1PPP/</text>
    <text x="118" y="476" font-size="21" fill="#EDE6D6">RNBQK2R w KQkq — <tspan fill="#F2B01E">any FEN</tspan></text>
  </g>

  <g font-family="Cinzel, 'Times New Roman', serif">
    <text x="90" y="180" font-size="30" letter-spacing="8" fill="#F2B01E" opacity="0.9">EN PENSENT</text>
    <text x="88" y="252" font-size="56" font-weight="700" fill="#EDE6D6">Every Game Is</text>
    <text x="88" y="312" font-size="56" font-weight="700" fill="url(#gold)">A Work of Art</text>
    <text x="90" y="570" font-size="22" fill="#8B93A7" font-family="Cormorant, Georgia, serif" font-style="italic">Paste any position or game — watch it paint itself.</text>
  </g>

  <!-- Transform arrow -->
  <g filter="url(#glow)">
    <path d="M 680 450 H 790" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 775 430 L 800 450 L 775 470" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== RIGHT: the vision (8×8 color flow board, squares-in-squares) ===== -->
  <g transform="translate(890,210)">
    <rect x="-16" y="-16" width="512" height="512" rx="10" fill="#0F1218" stroke="url(#gold)" stroke-width="3" filter="url(#softGlow)"/>

    <!-- Base checker (subtle) -->
    <g>
      <rect x="0" y="0" width="480" height="480" fill="#191D26"/>
      <g fill="#121620">
        <rect x="60" y="0" width="60" height="60"/><rect x="180" y="0" width="60" height="60"/><rect x="300" y="0" width="60" height="60"/><rect x="420" y="0" width="60" height="60"/>
        <rect x="0" y="60" width="60" height="60"/><rect x="120" y="60" width="60" height="60"/><rect x="240" y="60" width="60" height="60"/><rect x="360" y="60" width="60" height="60"/>
        <rect x="60" y="120" width="60" height="60"/><rect x="180" y="120" width="60" height="60"/><rect x="300" y="120" width="60" height="60"/><rect x="420" y="120" width="60" height="60"/>
        <rect x="0" y="180" width="60" height="60"/><rect x="120" y="180" width="60" height="60"/><rect x="240" y="180" width="60" height="60"/><rect x="360" y="180" width="60" height="60"/>
        <rect x="60" y="240" width="60" height="60"/><rect x="180" y="240" width="60" height="60"/><rect x="300" y="240" width="60" height="60"/><rect x="420" y="240" width="60" height="60"/>
        <rect x="0" y="300" width="60" height="60"/><rect x="120" y="300" width="60" height="60"/><rect x="240" y="300" width="60" height="60"/><rect x="360" y="300" width="60" height="60"/>
        <rect x="60" y="360" width="60" height="60"/><rect x="180" y="360" width="60" height="60"/><rect x="300" y="360" width="60" height="60"/><rect x="420" y="360" width="60" height="60"/>
        <rect x="0" y="420" width="60" height="60"/><rect x="120" y="420" width="60" height="60"/><rect x="240" y="420" width="60" height="60"/><rect x="360" y="420" width="60" height="60"/>
      </g>
    </g>

    <!-- Color flow traces (Hot & Cold palette: cold=white pieces, hot=black pieces) -->
    <!-- Single-layer squares -->
    <g opacity="0.92">
      <rect x="124" y="64"  width="52" height="52" fill="#EA580C"/>
      <rect x="184" y="124" width="52" height="52" fill="#F59E0B"/>
      <rect x="64"  y="184" width="52" height="52" fill="#1D4ED8"/>
      <rect x="364" y="64"  width="52" height="52" fill="#DC2626"/>
      <rect x="304" y="364" width="52" height="52" fill="#06B6D4"/>
      <rect x="124" y="424" width="52" height="52" fill="#10B981"/>
      <rect x="424" y="244" width="52" height="52" fill="#5B21B6"/>
      <rect x="4"   y="304" width="52" height="52" fill="#94A3B8"/>
      <rect x="364" y="424" width="52" height="52" fill="#1D4ED8"/>
      <rect x="244" y="4"   width="52" height="52" fill="#7F1D1D"/>
    </g>

    <!-- Nested "squares in squares" — the trademark layering -->
    <g>
      <!-- e4 hotspot: 4 layers -->
      <rect x="244" y="244" width="52" height="52" fill="#1D4ED8"/>
      <rect x="252" y="252" width="36" height="36" fill="#DC2626"/>
      <rect x="260" y="260" width="20" height="20" fill="#06B6D4"/>
      <rect x="266" y="266" width="8"  height="8"  fill="#F59E0B"/>
      <!-- d5 hotspot: 3 layers -->
      <rect x="184" y="184" width="52" height="52" fill="#10B981"/>
      <rect x="192" y="192" width="36" height="36" fill="#EA580C"/>
      <rect x="200" y="200" width="20" height="20" fill="#1E3A5F"/>
      <!-- f6 hotspot: 3 layers -->
      <rect x="304" y="124" width="52" height="52" fill="#EC4899"/>
      <rect x="312" y="132" width="36" height="36" fill="#5B21B6"/>
      <rect x="320" y="140" width="20" height="20" fill="#F59E0B"/>
      <!-- c3: 2 layers -->
      <rect x="124" y="304" width="52" height="52" fill="#06B6D4"/>
      <rect x="132" y="312" width="36" height="36" fill="#DC2626"/>
      <!-- g4: 2 layers -->
      <rect x="364" y="184" width="52" height="52" fill="#F59E0B"/>
      <rect x="372" y="192" width="36" height="36" fill="#1D4ED8"/>
    </g>
  </g>

  <!-- Bottom credit strip -->
  <g font-family="Inter, system-ui, sans-serif">
    <line x1="90" y1="800" x2="1510" y2="800" stroke="#2A2F3C" stroke-width="1"/>
    <text x="90" y="842" font-size="19" fill="#8B93A7" letter-spacing="2">ENPENSENT.COM — CHESS VISUALIZATION &amp; PREDICTION INTELLIGENCE</text>
    <text x="1510" y="842" font-size="19" fill="#F2B01E" letter-spacing="2" text-anchor="end">POWERED BY EN PENSENT</text>
  </g>
</svg>
