<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <!-- Sponsor lockup banner: En Pensent × Matcherino -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.5" stop-color="#141822"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F2B01E"/>
      <stop offset="0.5" stop-color="#F7C558"/>
      <stop offset="1" stop-color="#D99A12"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <line x1="0" y1="4" x2="1600" y2="4" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <line x1="0" y1="396" x2="1600" y2="396" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>

  <!-- Mark -->
  <g transform="translate(120,116)">
    <rect x="0"  y="0"  width="168" height="168" rx="10" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <rect x="26" y="26" width="116" height="116" rx="7"  fill="none" stroke="#1D4ED8" stroke-width="9"/>
    <rect x="48" y="48" width="72"  height="72"  rx="5"  fill="none" stroke="#DC2626" stroke-width="8"/>
    <rect x="68" y="68" width="32"  height="32"  rx="3"  fill="none" stroke="#06B6D4" stroke-width="7"/>
    <rect x="78" y="78" width="12"  height="12"  rx="2"  fill="#F2B01E"/>
  </g>

  <g font-family="Cinzel, 'Times New Roman', serif">
    <text x="360" y="172" font-size="70" font-weight="700" letter-spacing="4" fill="url(#gold)">EN PENSENT</text>
    <text x="364" y="228" font-size="26" letter-spacing="7" fill="#EDE6D6" opacity="0.85">TURN ANY CHESS GAME INTO COLLECTIBLE ART</text>
  </g>

  <!-- Divider × -->
  <g transform="translate(1090,200)" stroke="url(#gold)" stroke-width="6" stroke-linecap="round">
    <line x1="-22" y1="-22" x2="22" y2="22"/>
    <line x1="-22" y1="22" x2="22" y2="-22"/>
  </g>

  <!-- Sponsor slot (Matcherino drops their logo here) -->
  <g>
    <rect x="1170" y="120" width="330" height="160" rx="16" fill="#12151D" stroke="#2A2F3C" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="1335" y="192" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#8B93A7" text-anchor="middle" letter-spacing="3">SPONSOR LOGO</text>
    <text x="1335" y="226" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#4A5568" text-anchor="middle" letter-spacing="2">MATCHERINO</text>
  </g>

  <text x="800" y="356" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#8B93A7" text-anchor="middle" letter-spacing="4">ENPENSENT.COM — EVERY GAME IS A WORK OF ART</text>
</svg>
