<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <!-- En Pensent Wordmark — horizontal lockup for sponsor page headers -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F2B01E"/>
      <stop offset="0.4" stop-color="#F7C558"/>
      <stop offset="0.6" stop-color="#F5BC2F"/>
      <stop offset="1" stop-color="#F2B01E"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A87F2C"/>
      <stop offset="1" stop-color="#6E521C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="#0B0D12" rx="24"/>

  <!-- Mini nested-squares mark -->
  <g transform="translate(58,58)">
    <rect x="0"  y="0"  width="164" height="164" rx="8" fill="none" stroke="url(#gold)" stroke-width="9"/>
    <rect x="24" y="24" width="116" height="116" rx="6" fill="none" stroke="#1D4ED8" stroke-width="8"/>
    <rect x="46" y="46" width="72"  height="72"  rx="5" fill="none" stroke="#DC2626" stroke-width="7"/>
    <rect x="66" y="66" width="32"  height="32"  rx="3" fill="none" stroke="#06B6D4" stroke-width="6"/>
    <rect x="76" y="76" width="12"  height="12"  rx="2" fill="#F2B01E"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Cinzel, 'Times New Roman', serif">
    <text x="286" y="152" font-size="92" font-weight="700" letter-spacing="6" fill="url(#gold)">EN PENSENT</text>
    <text x="290" y="206" font-size="27" letter-spacing="10" fill="#EDE6D6" opacity="0.85">EVERY GAME IS A WORK OF ART</text>
  </g>

  <line x1="286" y1="170" x2="1136" y2="170" stroke="url(#goldSoft)" stroke-width="1.5" opacity="0.7"/>
</svg>
