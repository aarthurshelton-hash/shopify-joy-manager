<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- En Pensent Logo Mark — "Squares in Squares" trademark motif -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B01E"/>
      <stop offset="0.45" stop-color="#F7C558"/>
      <stop offset="0.6" stop-color="#F5BC2F"/>
      <stop offset="1" stop-color="#D99A12"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A87F2C"/>
      <stop offset="1" stop-color="#6E521C"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Obsidian field -->
  <rect width="512" height="512" rx="72" fill="#0B0D12"/>
  <rect x="10" y="10" width="492" height="492" rx="64" fill="none" stroke="url(#goldSoft)" stroke-width="2"/>

  <!-- Nested squares — each layer a piece passing through the same square -->
  <g filter="url(#glow)">
    <rect x="116" y="116" width="280" height="280" rx="10" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <rect x="156" y="156" width="200" height="200" rx="8"  fill="none" stroke="#1D4ED8" stroke-width="12"/>
    <rect x="192" y="192" width="128" height="128" rx="6"  fill="none" stroke="#DC2626" stroke-width="11"/>
    <rect x="224" y="224" width="64"  height="64"  rx="4"  fill="none" stroke="#06B6D4" stroke-width="10"/>
    <rect x="244" y="244" width="24"  height="24"  rx="3"  fill="#F2B01E"/>
  </g>
</svg>
